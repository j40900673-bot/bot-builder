name: Build Minecraft mod

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build for Minecraft 1.21.11
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle and cache dependencies
        uses: gradle/actions/setup-gradle@v4

      - name: Build mod JAR
        run: bash gradlew --no-daemon clean build

      - name: Prepare installable JAR
        run: |
          mkdir -p dist
          find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' -exec cp {} dist/ \;

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: schematic-builder-bot-minecraft-1.21.11
          path: dist/*.jar
          if-no-files-found: error
          retention-days: 14

